version: "3"

services:

  Etcd:
    image: bitnami/etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
#      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - 2379:2379
      - 2380:2380
    container_name: etcd
    volumes:
      - /etc/timezone:/etc/timezone
      - /etc/localtime:/etc/localtime
#      - /path/to/Etcd.conf.yml:/opt/bitnami/etcd/conf/etcd.conf.yml
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:1.46
    ports:
      - "16686:16686"  # Jaeger UI端口，访问http://localhost:16686查看追踪数据
      - "14250:14250"  # OTLP gRPC协议端口（推荐用于生产环境）
      - "4317:4317"    # OTLP HTTP/protobuf协议端口（适用于防火墙环境）
      - "4318:4318"    # OTLP HTTP协议端口
      - "6831:6831/udp"
      - "6832:6832/udp"
    volumes:
      - ./logs/jaeger:/var/log/jaeger  # 持久化日志目录
    environment:
      - TZ=Asia/Shanghai                # 设置时区
      - COLLECTOR_OTLP_ENABLED=true     # 启用OTLP数据收集
      - COLLECTOR_OTLP_HOST_PORT=0.0.0.0:14250  # gRPC监听地址
      - COLLECTOR_OTLP_HTTP_HOST_PORT=0.0.0.0:4318  # HTTP监听地址
    restart: always
